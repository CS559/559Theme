{{- /*
  tableofcontents — render the current page's table of contents inline
  (Hugo .Page.TableOfContents), titled "Page Contents".
  usage: {{< tableofcontents >}}
  params: none.
*/ -}}
<div class="post__toc toc">
	<h4 class="toc__title">{{ "Page Contents" }}</h4>
	<div class="toc__menu">
		{{ .Page.TableOfContents }}
	</div>
</div>
